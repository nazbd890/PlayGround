<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PlayGround Dodger</title>
<link rel="icon" href="data:," />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0b1020; color: #e8ecff; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  .wrap { width: min(560px, 94vw); text-align: center; }
  h1 { margin: 12px 0 4px; font-size: 28px; }
  p.sub { margin: 0 0 12px; color: #9aa6d0; }
  #hud { display: flex; justify-content: space-between; margin: 10px 0; font-variant-numeric: tabular-nums; }
  #hud strong { font-size: 18px; }
  canvas {
    width: 100%; height: auto; aspect-ratio: 3 / 4; display: block;
    background: #111833; border: 1px solid #2a3768; border-radius: 12px;
    touch-action: none;
  }
  .row { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
  button {
    background: #3b5bff; color: white; border: 0; border-radius: 10px;
    padding: 10px 16px; font-size: 15px; cursor: pointer;
  }
  button.secondary { background: #223052; }
  .keys { color: #9aa6d0; font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<main class="wrap">
  <h1>PlayGround Dodger</h1>
  <p class="sub">Move the ship. Dodge the blocks. Survive.</p>
  <div id="hud">
    <div>Score<br /><strong id="score">0</strong></div>
    <div>Best<br /><strong id="best">0</strong></div>
    <div>Status<br /><strong id="status">ready</strong></div>
  </div>
  <canvas id="game" width="480" height="640" aria-label="PlayGround Dodger game canvas"></canvas>
  <div class="row">
    <button id="startBtn" type="button">Start / Restart (Space)</button>
    <button id="pauseBtn" type="button" class="secondary">Pause (P)</button>
  </div>
  <p class="keys">Controls: ← → or A/D to move, Space to start, P to pause. Touch/drag also works.</p>
</main>
<script>
(function () {
  'use strict';
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var statusEl = document.getElementById('status');
  var startBtn = document.getElementById('startBtn');
  var pauseBtn = document.getElementById('pauseBtn');

  var W = canvas.width, H = canvas.height;
  var player = { x: W / 2, y: H - 70, w: 44, h: 18, speed: 340 };
  var blocks = [];
  var score = 0, best = 0, running = false, paused = false, last = 0, spawnT = 0, elapsed = 0;
  var keys = {};

  try { best = parseInt(localStorage.getItem('dodger-best') || '0', 10) || 0; } catch (e) {}
  bestEl.textContent = String(best);

  function reset() {
    blocks = [];
    score = 0; elapsed = 0; spawnT = 0;
    player.x = W / 2;
    scoreEl.textContent = '0';
  }
  function start() {
    reset();
    running = true; paused = false; last = performance.now();
    statusEl.textContent = 'playing';
    requestAnimationFrame(frame);
  }
  function togglePause() {
    if (!running) return;
    paused = !paused;
    statusEl.textContent = paused ? 'paused' : 'playing';
    if (!paused) { last = performance.now(); requestAnimationFrame(frame); }
  }
  function spawn(dt) {
    spawnT -= dt;
    if (spawnT > 0) return;
    var difficulty = Math.min(1, elapsed / 45);
    spawnT = 0.55 - difficulty * 0.32;
    var w = 26 + Math.random() * 54;
    blocks.push({
      x: Math.random() * (W - w),
      y: -30,
      w: w,
      h: 18 + Math.random() * 18,
      v: (150 + Math.random() * 140) * (1 + difficulty * 1.1)
    });
  }
  function hit(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }
  function frame(now) {
    if (!running || paused) return;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    elapsed += dt;
    score = Math.floor(elapsed * 10);
    scoreEl.textContent = String(score);

    var dir = 0;
    if (keys.ArrowLeft || keys.a || keys.A) dir -= 1;
    if (keys.ArrowRight || keys.d || keys.D) dir += 1;
    player.x += dir * player.speed * dt;
    player.x = Math.max(0, Math.min(W - player.w, player.x));

    spawn(dt);
    var pbox = { x: player.x, y: player.y, w: player.w, h: player.h };
    for (var i = blocks.length - 1; i >= 0; i--) {
      blocks[i].y += blocks[i].v * dt;
      if (blocks[i].y > H + 40) blocks.splice(i, 1);
      else if (hit(pbox, blocks[i])) { gameOver(); return; }
    }
    draw();
    requestAnimationFrame(frame);
  }
  function gameOver() {
    running = false;
    statusEl.textContent = 'game over';
    if (score > best) {
      best = score;
      bestEl.textContent = String(best);
      try { localStorage.setItem('dodger-best', String(best)); } catch (e) {}
    }
    draw();
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#111833';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    for (var y = 0; y < H; y += 40) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.fillStyle = '#ff5470';
    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      ctx.beginPath();
      ctx.roundRect(b.x, b.y, b.w, b.h, 6);
      ctx.fill();
    }
    ctx.fillStyle = '#39d98a';
    ctx.beginPath();
    ctx.moveTo(player.x + player.w / 2, player.y - 14);
    ctx.lineTo(player.x + player.w, player.y + player.h);
    ctx.lineTo(player.x, player.y + player.h);
    ctx.closePath();
    ctx.fill();
    if (!running) {
      ctx.fillStyle = 'rgba(5,8,20,0.62)';
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 30px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(statusEl.textContent === 'game over' ? 'Game Over' : 'Ready?', W / 2, H / 2 - 8);
      ctx.font = '15px system-ui, sans-serif';
      ctx.fillStyle = '#9aa6d0';
      ctx.fillText('Press Start or Space', W / 2, H / 2 + 22);
    }
  }

  window.addEventListener('keydown', function (e) {
    keys[e.key] = true;
    if (e.key === ' ') { e.preventDefault(); start(); }
    if (e.key === 'p' || e.key === 'P') togglePause();
  });
  window.addEventListener('keyup', function (e) { keys[e.key] = false; });
  startBtn.addEventListener('click', start);
  pauseBtn.addEventListener('click', togglePause);

  var dragging = false;
  function moveTo(clientX) {
    var r = canvas.getBoundingClientRect();
    var cx = (clientX - r.left) * (W / r.width);
    player.x = Math.max(0, Math.min(W - player.w, cx - player.w / 2));
    if (!running) draw();
  }
  canvas.addEventListener('pointerdown', function (e) { dragging = true; moveTo(e.clientX); });
  window.addEventListener('pointermove', function (e) { if (dragging) moveTo(e.clientX); });
  window.addEventListener('pointerup', function () { dragging = false; });

  draw();
  window.__sceneReady = true;
})();
</script>
</body>
</html>
